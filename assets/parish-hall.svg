<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6d5e8" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#d4e8f3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c85a42"/>
      <stop offset="100%" stop-color="#9e3b26"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9ec"/>
      <stop offset="100%" stop-color="#eae0c8"/>
    </linearGradient>
    <radialGradient id="cloudWash" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a8cde4" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#cde2ef" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Watercolor Sky Background Wash -->
  <rect width="800" height="600" fill="#fdfbf7"/>
  <ellipse cx="400" cy="270" rx="360" ry="220" fill="url(#cloudWash)" filter="url(#watercolor)"/>
  <path d="M 80,340 Q 200,140 400,150 Q 600,140 720,340 Q 600,450 400,440 Q 180,450 80,340 Z" fill="url(#skyGrad)" filter="url(#watercolor)"/>

  <!-- Background Palm Trees and Greenery -->
  <g filter="url(#watercolor)" opacity="0.9">
    <ellipse cx="140" cy="380" rx="80" ry="80" fill="#608050"/>
    <ellipse cx="200" cy="390" rx="70" ry="60" fill="#4d693f"/>
    <ellipse cx="600" cy="390" rx="70" ry="60" fill="#4d693f"/>
    <ellipse cx="660" cy="380" rx="80" ry="80" fill="#608050"/>
    <!-- Palm frond silhouettes -->
    <path d="M 120,340 Q 80,300 40,320 M 120,340 Q 90,270 70,250 M 120,340 Q 140,260 160,250 M 120,340 Q 170,290 200,300" stroke="#3d5631" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 680,340 Q 720,300 760,320 M 680,340 Q 710,270 730,250 M 680,340 Q 660,260 640,250 M 680,340 Q 630,290 600,300" stroke="#3d5631" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Parish Hall Structure -->
  <g id="hall-building" filter="url(#watercolor)">
    <!-- Base Plinth -->
    <rect x="150" y="470" width="500" height="30" fill="#9e9182"/>
    <rect x="180" y="450" width="440" height="20" fill="#baa995"/>

    <!-- Main Hall Façade Body -->
    <rect x="180" y="270" width="440" height="180" fill="url(#wallGrad)" stroke="#c2b293" stroke-width="2"/>

    <!-- Classic Traditional Kerala Sloped Roof -->
    <polygon points="140,270 660,270 540,160 260,160" fill="url(#roofGrad)"/>

    <!-- Front Portico Gable (Pediment) -->
    <polygon points="300,270 500,270 400,185" fill="url(#roofGrad)" stroke="#822814" stroke-width="2"/>
    <polygon points="320,270 480,270 400,200" fill="url(#wallGrad)"/>

    <!-- Decorative Gable Cross / Motif -->
    <path d="M400,140 v20 M393,147 h14" stroke="#c5a557" stroke-width="3" stroke-linecap="round"/>
    <circle cx="400" cy="225" r="14" fill="#30475e" stroke="#c5a557" stroke-width="2"/>
    <path d="M400,215 v20 M390,225 h20" stroke="#c5a557" stroke-width="1.5"/>

    <!-- Front Entrance Pillars / Verandah Columns -->
    <rect x="330" y="270" width="16" height="180" fill="#fff" stroke="#d5c8ad" stroke-width="1.5"/>
    <rect x="380" y="270" width="16" height="180" fill="#fff" stroke="#d5c8ad" stroke-width="1.5"/>
    <rect x="404" y="270" width="16" height="180" fill="#fff" stroke="#d5c8ad" stroke-width="1.5"/>
    <rect x="454" y="270" width="16" height="180" fill="#fff" stroke="#d5c8ad" stroke-width="1.5"/>

    <!-- Side Windows (Traditional Arched & Louvered) -->
    <path d="M 210,380 v -40 a 18,18 0 0 1 36,0 v 40 z" fill="#2d4257" stroke="#c5a557" stroke-width="2"/>
    <path d="M 265,380 v -40 a 18,18 0 0 1 36,0 v 40 z" fill="#2d4257" stroke="#c5a557" stroke-width="2"/>
    <path d="M 500,380 v -40 a 18,18 0 0 1 36,0 v 40 z" fill="#2d4257" stroke="#c5a557" stroke-width="2"/>
    <path d="M 555,380 v -40 a 18,18 0 0 1 36,0 v 40 z" fill="#2d4257" stroke="#c5a557" stroke-width="2"/>

    <!-- Grand Double Door -->
    <path d="M 360,450 v -60 a 40,40 0 0 1 80,0 v 60 z" fill="#52311f" stroke="#c5a557" stroke-width="3"/>
    <path d="M 400,390 v 60" stroke="#c5a557" stroke-width="2"/>

    <!-- Golden Hall Sign Banner -->
    <rect x="335" y="295" width="130" height="24" rx="4" fill="#faf7f0" stroke="#c5a557" stroke-width="1.5"/>
    <text x="400" y="311" font-family="serif" font-size="11" font-weight="bold" fill="#9c7f3a" text-anchor="middle" letter-spacing="1">PARISH HALL</text>

    <!-- Festoon / Bunting Flags for Celebration -->
    <path d="M 180,285 Q 240,300 300,285 Q 360,300 420,285 Q 480,300 540,285 Q 580,295 620,285" fill="none" stroke="#c5a557" stroke-width="1.5" stroke-dasharray="1,4"/>
  </g>

  <!-- Foreground Grass & Floral Garden Accents -->
  <g filter="url(#watercolor)">
    <ellipse cx="400" cy="510" rx="320" ry="30" fill="#6d8b5b" opacity="0.6"/>
    <ellipse cx="280" cy="500" rx="90" ry="20" fill="#4d693f" opacity="0.75"/>
    <ellipse cx="520" cy="500" rx="90" ry="20" fill="#4d693f" opacity="0.75"/>
    <circle cx="220" cy="495" r="5" fill="#f0ad4e" opacity="0.8"/>
    <circle cx="240" cy="505" r="4" fill="#d9534f" opacity="0.8"/>
    <circle cx="560" cy="505" r="4" fill="#d9534f" opacity="0.8"/>
    <circle cx="580" cy="495" r="5" fill="#f0ad4e" opacity="0.8"/>
  </g>
</svg>